<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Good fixture</title>
<main>
  <a href="#details">Jump to details</a>
  <a href="https://example.com/" target="_blank" rel="noopener">Example (opens a new tab)</a>
  <a href="mailto:hello@example.com">Email us</a>
  <button type="button" aria-controls="panel" aria-expanded="false">Show panel</button>
  <div id="panel" hidden>Panel content</div>
  <details id="details"><summary>Details</summary><p>More detail.</p></details>
  <form id="signup" method="post" action="signup">
    <label>Email <input name="email" type="email" required></label>
    <label>Seats <input name="seats" type="number" min="1" max="4" required></label>
    <button>Sign up</button>
  </form>
  <p id="out" role="status"></p>
</main>
<script>
  const btn = document.querySelector('[aria-controls=panel]'), panel = document.getElementById('panel');
  btn.addEventListener('click', () => { panel.hidden = !panel.hidden; btn.setAttribute('aria-expanded', String(!panel.hidden)); });
  const form = document.getElementById('signup');
  form.addEventListener('submit', e => { e.preventDefault(); document.getElementById('out').textContent = `Signed up ${form.email.value} for ${form.seats.value} seats.`; });
  function runSelfTest() {
    form.email.value = 'a@b.co'; form.seats.value = '2'; form.requestSubmit();
    console.assert(document.getElementById('out').textContent.includes('a@b.co'), 'submit shows result');
    console.log('SELFTEST PASS');
  }
  if (location.hash === '#selftest') runSelfTest();
</script>
</html>
